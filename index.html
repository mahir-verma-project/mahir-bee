<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ShopEasy</h1>
        <p>Your simple online shopping store</p>
        <h3>Cart Items: <span id="cart-count">0</span></h3>
    </header>

    <main>
        <h2>Our Products</h2>

        <div class="filters">
            <input type="text" id="search" placeholder="Search products...">

            <select id="category">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
            </select>

            <select id="sort">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

        <div id="products" class="products"></div>

        <h2>My Shopping Cart</h2>
        <div id="cart"></div>

        <div class="summary">
            <p>Subtotal: ₹<span id="subtotal">0</span></p>

            <div class="coupon">
                <input type="text" id="coupon"
                       placeholder="Enter coupon code">
                <button onclick="applyCoupon()">Apply Coupon</button>
            </div>

            <p id="coupon-message"></p>
            <p>Discount: ₹<span id="discount">0</span></p>
            <h3>Total: ₹<span id="total">0</span></h3>
        </div>

        <h2>Checkout</h2>

        <form id="checkout-form">
            <input type="text" id="customer-name"
                   placeholder="Your Name" required>

            <input type="email" id="customer-email"
                   placeholder="Your Email" required>

            <input type="text" id="customer-address"
                   placeholder="Delivery Address" required>

            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="UPI">UPI (Demo)</option>
            </select>

            <button type="submit">Place Order</button>
        </form>

        <p id="order-message"></p>
    </main>

    <footer>
        <p>ShopEasy | E-commerce Mini Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
